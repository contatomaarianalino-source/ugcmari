<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Mariana Lino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#f6efe6; --creme-escuro:#ecdfcf; --papel:#fffdf9; --cafe:#6b4a35; --cafe-escuro:#4a3224;
    --tinta:#3a2a20; --tinta-suave:#6a574a; --verde:#4f7a54; --verde-escuro:#3d6142; --vermelho-escuro:#a8412f;
    --tracejado:rgba(107,74,53,.42);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:400 15px/1.5 "Figtree",system-ui,sans-serif;color:var(--tinta);
    background-color:var(--creme);background-image:radial-gradient(rgba(107,74,53,.07) 1px,transparent 1px);background-size:22px 22px}
  .cartao{width:100%;max-width:380px;background:var(--papel);border:2px dashed var(--tracejado);border-radius:18px;padding:28px 26px;box-shadow:0 10px 30px -18px rgba(74,50,36,.35)}
  h1{margin:0 0 4px;font-size:1.25rem;font-weight:800;color:var(--cafe-escuro)}
  .sub{margin:0 0 20px;font-size:.9rem;color:var(--tinta-suave)}
  label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px;color:var(--cafe-escuro)}
  input{width:100%;font:inherit;padding:10px 12px;min-height:44px;border-radius:12px;border:2px dashed var(--tracejado);background:var(--creme);color:var(--tinta)}
  input:focus{outline:3px solid var(--verde);outline-offset:1px;border-color:var(--verde);background:#fff}
  .campo{margin-bottom:14px}
  button{width:100%;min-height:46px;border:0;border-radius:999px;background:var(--cafe);color:#fff;font:700 .95rem "Figtree",sans-serif;cursor:pointer}
  button:hover{background:var(--cafe-escuro)}
  button:disabled{opacity:.6;cursor:wait}
  .link{display:inline-block;margin-top:14px;background:none;border:0;padding:0;width:auto;min-height:0;color:var(--cafe);font:600 .85rem "Figtree",sans-serif;text-decoration:underline;cursor:pointer}
  .link:hover{background:none;color:var(--cafe-escuro)}
  .faixa{display:none;margin:0 0 14px;padding:10px 12px;border-radius:12px;font-size:.88rem;font-weight:600}
  .faixa.erro{display:block;background:#f7e3df;color:var(--vermelho-escuro);border:2px dashed #d99a8d}
  .faixa.ok{display:block;background:#e8f0e6;color:var(--verde-escuro);border:2px dashed var(--verde)}
  :focus-visible{outline:3px solid var(--verde);outline-offset:2px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="cartao">
  <h1>Painel da Mari</h1>
  <p class="sub" id="subtitulo">Entre para cuidar do seu portfólio.</p>
  <p class="faixa" id="faixa" role="alert"></p>

  <!-- Entrar -->
  <form id="form-entrar" novalidate>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button type="submit" id="btn-entrar">Entrar</button>
    <button type="button" class="link" id="btn-esqueci">Esqueci minha senha</button>
  </form>

  <!-- Nova senha (aparece quando você chega pelo link do e-mail de recuperação) -->
  <form id="form-nova" hidden novalidate>
    <div class="campo"><label for="nova">Nova senha (mínimo 8 caracteres)</label><input id="nova" type="password" autocomplete="new-password" minlength="8" required></div>
    <button type="submit">Salvar nova senha</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
  const banco = window.banco;
  const faixa = document.getElementById("faixa");
  const formEntrar = document.getElementById("form-entrar");
  const formNova = document.getElementById("form-nova");
  const mostrar = (tipo, texto) => { faixa.className = "faixa " + tipo; faixa.textContent = texto; };
  const irProPainel = () => location.replace("../admin/");

  if (!banco) {
    mostrar("erro", "Não consegui conectar ao banco agora. Confira a internet e recarregue a página.");
  } else {
    /* Chegou pelo link de recuperação de senha: mostra o campo de nova senha */
    let recuperando = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
    banco.auth.onAuthStateChange((evento) => {
      if (evento === "PASSWORD_RECOVERY") {
        recuperando = true;
        formEntrar.hidden = true; formNova.hidden = false;
        document.getElementById("subtitulo").textContent = "Crie uma senha nova.";
      }
    });
    /* Já tem sessão aberta: vai direto para o painel */
    banco.auth.getSession().then(({ data }) => {
      if (data && data.session && !recuperando) irProPainel();
      if (recuperando) { formEntrar.hidden = true; formNova.hidden = false; }
    });

    formEntrar.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      if (!email || !senha) { mostrar("erro", "Preencha o e-mail e a senha."); return; }
      const botao = document.getElementById("btn-entrar");
      botao.disabled = true; botao.textContent = "Entrando...";
      const { error } = await banco.auth.signInWithPassword({ email, password: senha });
      botao.disabled = false; botao.textContent = "Entrar";
      if (error) {
        mostrar("erro", /invalid|credentials|password|email/i.test(error.message)
          ? "E-mail ou senha incorretos"
          : "Não consegui entrar agora. Tente de novo em instantes.");
        return;
      }
      irProPainel();
    });

    document.getElementById("btn-esqueci").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) { mostrar("erro", "Escreva o seu e-mail no campo acima e clique de novo."); return; }
      const { error } = await banco.auth.resetPasswordForEmail(email, { redirectTo: window.SITE_URL + "login/" });
      if (error) mostrar("erro", "Não consegui enviar o e-mail agora. Tente de novo em alguns minutos.");
      else mostrar("ok", "Pronto! Se esse e-mail for o do painel, chega um link para criar uma senha nova.");
    });

    formNova.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nova = document.getElementById("nova").value;
      if (nova.length < 8) { mostrar("erro", "A senha precisa ter pelo menos 8 caracteres."); return; }
      const { error } = await banco.auth.updateUser({ password: nova });
      if (error) { mostrar("erro", "Não consegui salvar a senha. Peça um novo link e tente de novo."); return; }
      mostrar("ok", "Senha nova salva! Abrindo o painel...");
      setTimeout(irProPainel, 900);
    });
  }
</script>
</body>
</html>
